<style>
:root{
  --deep:#1B1230;
  --deep-2:#241A3D;
  --purple:#7C3AED;
  --magenta:#D6409F;
  --coral:#F0475A;
  --gold:#F5A623;
  --ink:#F5EEFF;
  --ink-dim:#C7B8E8;
  --card:rgba(255,255,255,0.05);
  --card-border:rgba(255,255,255,0.10);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  min-height:100vh;
  background:
    radial-gradient(1200px 700px at 20% -10%,rgba(124,58,237,0.35),transparent 60%),
    radial-gradient(1000px 600px at 100% 0%,rgba(240,71,90,0.25),transparent 55%),
    var(--deep);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:6vh 20px 60px;
  transition:padding .5s ease;
}

body.searched{padding-top:4vh;}

.brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  user-select:none;
  cursor:pointer;
}

.logo-img{
  height:150px;
  width:150px;
  object-fit:contain;
  display:block;
  transition:height .4s ease;
  filter:drop-shadow(0 6px 24px rgba(214,64,159,.25));
}

.logo-img.spin-globe{
  animation:pulseLogo 1.1s ease-in-out infinite;
}

@keyframes pulseLogo{
  0%,100%{opacity:1;}
  50%{opacity:.6;}
}

.tagline{
  color:var(--ink-dim);
  font-size:14px;
  font-weight:500;
  margin-top:2px;
  letter-spacing:.2px;
}

body.searched .logo-img{height:78px;}
body.searched .tagline{display:none;}

.search-shell{
  width:100%;
  max-width:640px;
  margin-top:36px;
}

body.searched .search-shell{margin-top:28px;}

.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--card);
  border:1.5px solid var(--card-border);
  border-radius:999px;
  padding:14px 20px;
  backdrop-filter:blur(6px);
  transition:border-color .25s ease,box-shadow .25s ease;
}

.search-box:focus-within{
  border-color:var(--magenta);
  box-shadow:0 0 0 4px rgba(214,64,159,.15);
}

.search-box input{
  flex:1;
  min-width:0;
  background:none;
  border:none;
  outline:none;
  color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:17px;
  font-weight:500;
}

.search-box input::placeholder{color:var(--ink-dim);}

.search-btn{
  border:none;
  cursor:pointer;
  border-radius:999px;
  padding:10px 20px;
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:15px;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--coral));
  transition:transform .15s ease,opacity .15s ease;
  white-space:nowrap;
}

.search-btn:hover{transform:translateY(-1px);}
.search-btn:active{transform:scale(.98);}
.search-btn:disabled{opacity:.6;cursor:default;transform:none;}

.hint-row{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.hint-chip{
  font-size:13px;
  color:var(--ink-dim);
  border:1px solid var(--card-border);
  background:rgba(255,255,255,.03);
  padding:6px 12px;
  border-radius:999px;
  cursor:pointer;
  transition:background .2s ease,color .2s ease;
}

.hint-chip:hover{
  background:rgba(255,255,255,.08);
  color:var(--ink);
}

.results-shell{
  width:100%;
  max-width:680px;
  margin-top:34px;
  display:none;
  flex-direction:column;
  gap:22px;
}

.results-shell.show{display:flex;}

.status-line{
  color:var(--ink-dim);
  font-size:13px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--gold);
  animation:pulse 1.2s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:.3;}
  50%{opacity:1;}
}

.answer-card{
  position:relative;
  border-radius:20px;
  padding:2px;
  background:linear-gradient(135deg,var(--purple),var(--coral) 50%,var(--gold));
  animation:fadeIn .5s ease;
}

.answer-card-inner{
  background:var(--deep-2);
  border-radius:18px;
  padding:22px 24px;
}

.answer-label{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:13px;
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:10px;
}

.answer-text{
  font-size:17px;
  line-height:1.55;
  color:var(--ink);
}

.results-list{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.results-list-label{
  font-family:'Baloo 2',sans-serif;
  font-size:13px;
  font-weight:700;
  color:var(--ink-dim);
  text-transform:uppercase;
  letter-spacing:.6px;
  margin:0 4px 10px;
}

.result-item{
  padding:14px 16px;
  border-radius:14px;
  border:1px solid var(--card-border);
  background:var(--card);
  margin-bottom:10px;
  animation:fadeIn .4s ease;
  transition:border-color .2s ease,transform .15s ease;
}

.result-item:hover{
  border-color:rgba(214,64,159,.5);
  transform:translateX(2px);
}

.result-title{
  font-size:16px;
  font-weight:700;
  color:var(--ink);
  text-decoration:none;
  display:block;
  margin-bottom:4px;
}

.result-url{
  font-size:12.5px;
  color:var(--gold);
  opacity:.85;
  margin-bottom:6px;
  word-break:break-all;
}

.result-snippet{
  font-size:13.5px;
  color:var(--ink-dim);
  line-height:1.5;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

.error-box{
  text-align:center;
  color:var(--ink-dim);
  font-size:14px;
  padding:20px;
}

.footer-note{
  margin-top:40px;
  font-size:12px;
  color:var(--ink-dim);
  opacity:.6;
  text-align:center;
}

/* WEATHER CARD */

.weather-card{
  width:100%;
  padding:24px;
  border-radius:22px;
  color:#fff;
  background:
    radial-gradient(circle at 88% 12%,rgba(96,165,250,.30),transparent 34%),
    linear-gradient(135deg,#101d42,#20265b 58%,#35265f);
  border:1px solid rgba(150,185,255,.24);
  box-shadow:0 15px 40px rgba(0,0,0,.20);
  animation:fadeIn .45s ease;
}

.weather-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.weather-brand{
  font-size:10px;
  letter-spacing:2px;
  color:#a9d0ff;
  font-weight:800;
}

.weather-city{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.weather-description{
  font-size:13px;

}

.weather-icon{font-size:48px;line-height:1;}

.weather-temperature{
  font-size:72px;
  font-weight:800;
  letter-spacing:-4px;

}

.weather-temperature small{

}

.weather-details{

  grid-template-columns:repeat(3,minmax(0,1fr));

.weather-detail{

}

.weather-detail strong{
  font-size:15px;
  overflow-wrap:anywhere;
}

.weather-source{
  font-size:10px;
  color:#a9c3e9;
  margin-top:18px;
}

.weather-message{
  padding:15px 17px;
  border:1px solid rgba(240,71,90,.30);
  border-radius:14px;
  background:rgba(240,71,90,.09);
  color:#f5dce1;
  font-size:13px;
  line-height:1.55;
}

.ars-live-heading{

.ars-live-refresh{

.ars-live-team span{overflow-wrap:anywhere;}

.ars-live-team-logo,

.ars-live-team-placeholder{

.ars-live-score{

  .logo-img{height:120px;width:120px;}

  .weather-details strong{font-size:13px;}

  .ars-live-match{padding:15px;}

</style>

<body>

<div class="brand" id="brand" title="ARASANA anasayfa">
  <img
    id="logoImg"
    class="logo-img"
    src="/favicon.png"
    alt="Arasana"
  >
  <div class="tagline">gerçek cevap, gereksiz gürültü yok</div>
</div>

<div class="search-shell">
  <div class="search-box">
    <input
      id="queryInput"
      type="text"
      placeholder="Bişey sor bakalım..."
      autocomplete="off"
    >
    <button class="search-btn" id="searchBtn">Arasana</button>
  </div>

  <div class="hint-row" id="hintRow">
    <div class="hint-chip">İstanbul'da hava nasıl</div>
    <div class="hint-chip">En iyi python IDE</div>
    <div class="hint-chip">Türk kahvesi nasıl yapılır</div>
  </div>
</div>

<div class="results-shell" id="resultsShell">
  <div class="status-line" id="statusLine" style="display:none;">
    <span class="dot"></span> ARASANA aranıyor...
  </div>
  <div id="answerArea"></div>
  <div id="listArea"></div>
</div>

<div class="footer-note">
  ARASANA · deneysel bir arama motoru projesi
</div>

<script>
const brand = document.getElementById('brand');
const logoImg = document.getElementById('logoImg');
const input = document.getElementById('queryInput');
const btn = document.getElementById('searchBtn');
const hintRow = document.getElementById('hintRow');
const resultsShell = document.getElementById('resultsShell');
const statusLine = document.getElementById('statusLine');
const answerArea = document.getElementById('answerArea');
const listArea = document.getElementById('listArea');

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function domainOf(url){
  try{
    return new URL(url).hostname.replace(/^www\./,'');
  }catch(e){
    return url || '';
  }
}

// Hava durumu sorgusu algılama
function isWeatherQuery(query){
  const q = String(query || '').toLocaleLowerCase('tr-TR');

  const patterns = [
    /\bhava\s+durumu\b/,
    /\bhava\s+nasıl\b/,
    /\bhava\s+kaç\s+derece\b/,
    /\bkaç\s+derece\b/,
    /\byağmur\b/,
    /\bsağanak\b/,
    /\bkar\s+(yağışı|yağacak|yağıyor)\b/,
    /\bmeteoroloji\b/,
    /\bsıcaklık\b/,
    /\bhava\s+tahmini\b/,
    /\brüzg[âa]r\b/,
    /\bnem\s+oranı\b/,
    /\bfırtına\b/,
    /\bdolu\s+yağışı\b/,
    /\bweather\b/,
    /\bforecast\b/
  ];

  return patterns.some(pattern => pattern.test(q));
}

function setStatus(message){
  statusLine.innerHTML =
    '<span class="dot"></span> ' + escapeHtml(message);
}

// Konum alma
function getLocation(){
  return new Promise((resolve,reject) => {
    if(!navigator.geolocation){
      reject(new Error('Tarayıcınız konum özelliğini desteklemiyor.'));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position => resolve({
        latitude:position.coords.latitude,
        longitude:position.coords.longitude
      }),
      error => {
        const messages = {
          1:'Konum izni verilmedi. Tarayıcı ayarlarından Arasana için konum iznini açabilirsiniz.',
          2:'Konumunuz belirlenemedi. Cihazınızın konum hizmetlerini kontrol edin.',
          3:'Konum isteği zaman aşımına uğradı. Lütfen tekrar deneyin.'
        };

        reject(new Error(
          messages[error.code] || 'Konum alınamadı.'
        ));
      },
      {
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:300000
      }
    );
  });
}

// Hava durumu kartı
function renderWeather(data){
  const temperature = data.temperature ?? data.temp ?? '--';
  const feelsLike = data.feelsLike ?? data.feels_like ?? '--';
  const humidity = data.humidity ?? '--';
  const windSpeed = data.windSpeed ?? data.wind_speed ?? '--';
  const location = data.location ?? data.city ?? 'Bulunduğun konum';
  const description = data.description ?? data.condition ?? 'Güncel hava durumu';
  const icon = data.icon ?? '🌤️';

  answerArea.insertAdjacentHTML('afterbegin', `
    <section class="weather-card" aria-label="Güncel hava durumu">
      <div class="weather-top">
        <div>
          <div class="weather-brand">ARASANA WEATHER</div>
          <div class="weather-city">${escapeHtml(location)}</div>
          <div class="weather-description">${escapeHtml(description)}</div>
        </div>
        <div class="weather-icon" aria-hidden="true">${escapeHtml(icon)}</div>
      </div>

      <div class="weather-temperature">
        ${escapeHtml(temperature)}<small>°C</small>
      </div>

      <div class="weather-details">
        <div class="weather-detail">
          <span>Hissedilen</span>
          <strong>${escapeHtml(feelsLike)}°</strong>
        </div>
        <div class="weather-detail">
          <span>Nem</span>
          <strong>${escapeHtml(humidity)}%</strong>
        </div>
        <div class="weather-detail">
          <span>Rüzgâr</span>
          <strong>${escapeHtml(windSpeed)} km/sa</strong>
        </div>
      </div>

      <div class="weather-source">
        Veri kaynağı: Meteoroloji Genel Müdürlüğü
      </div>
    </section>
  `);
}

function renderWeatherError(message){
  answerArea.insertAdjacentHTML('afterbegin', `
    <div class="weather-message">
      <strong>Hava durumu şu anda gösterilemiyor.</strong><br>
      ${escapeHtml(message)}
    </div>
  `);
}

// Ana sayfaya dön
brand.addEventListener('click', () => {
  document.body.classList.remove('searched');
  resultsShell.classList.remove('show');
  answerArea.innerHTML = '';
  listArea.innerHTML = '';
  input.value = '';
  hintRow.style.display = 'flex';
});

// Öneri aramaları
hintRow.addEventListener('click', e => {
  if(e.target.classList.contains('hint-chip')){
    input.value = e.target.textContent;
    runSearch();
  }
});

input.addEventListener('keydown', e => {
  if(e.key === 'Enter') runSearch();
});

btn.addEventListener('click', runSearch);

// URL üzerinden otomatik arama
(function autoRunFromUrl(){
  const q = new URLSearchParams(window.location.search).get('q');

  if(q && q.trim()){
    input.value = q.trim();
    runSearch();
  }
})();

// ARASANA ARAMA SİSTEMİ
async function runSearch(){
  const query = input.value.trim();

  if(!query || btn.disabled) return;

  document.body.classList.add('searched');
  hintRow.style.display = 'none';
  resultsShell.classList.add('show');
  statusLine.style.display = 'flex';

  logoImg.classList.add('spin-globe');

  answerArea.innerHTML = '';
  listArea.innerHTML = '';

  btn.disabled = true;

  try{

    // HAVA DURUMU
    if(isWeatherQuery(query)){
      try{
        setStatus('Konumun belirleniyor...');

        const location = await getLocation();

        setStatus('Hava durumu getiriliyor...');

        const weatherResponse = await fetch('/api/weather',{
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify(location)
        });

        let weatherData;

        try{
          weatherData = await weatherResponse.json();
        }catch(parseError){
          throw new Error(
            'Hava durumu sunucusundan geçerli bir yanıt alınamadı.'
          );
        }

        if(!weatherResponse.ok || weatherData.error){
          throw new Error(
            weatherData.error || 'Hava durumu servisi yanıt vermedi.'
          );
        }

        renderWeather(weatherData);

      }catch(weatherError){
        renderWeatherError(
          weatherError.message || 'Konum veya hava durumu verisi alınamadı.'
        );
      }
    }

    // HESAP MAKİNESİ
    if(
      window.ArasanaCalc &&
      window.ArasanaCalc.isCalcSearch(query)
    ){
      try{
        window.ArasanaCalc.start();
      }catch(calcError){
        console.error('Hesap makinesi hatası:',calcError);
      }
    }

    // NAMAZ VAKİTLERİ
    if(
      window.ArasanaPrayer &&
      window.ArasanaPrayer.isPrayerSearch(query)
    ){
      try{
        setStatus('Namaz vakitleri hazırlanıyor...');
        await window.ArasanaPrayer.start();
      }catch(prayerError){
        console.error('Namaz vakitleri hatası:',prayerError);
      }
    }

    // CANLI FUTBOL MAÇLARI
    // Bu işlem normal arama API'sinden bağımsız çalışır.
    if(
      window.ArasanaLiveMatch &&
      window.ArasanaLiveMatch.isMatchQuery(query)
    ){
      try{
        setStatus('Futbol maçları kontrol ediliyor...');
        await window.ArasanaLiveMatch.start(query);
      }catch(matchError){
        console.error('Canlı maç hatası:',matchError);
      }
    }

    // MEVCUT ARAMA API'Sİ
    setStatus('ARASANA aranıyor...');

    const response = await fetch('/api/search',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({query})
    });

    let parsed;

    try{
      parsed = await response.json();
    }catch(parseError){
      throw new Error(
        'Arama sunucusundan geçerli bir yanıt alınamadı.'
      );
    }

    if(!response.ok || parsed.error){
      throw new Error(
        parsed.error || 'Arama sırasında bir hata oluştu.'
      );
    }

    renderResults(parsed);

  }catch(err){
    console.error('ARASANA hata:',err);

    answerArea.insertAdjacentHTML('beforeend', `
      <div class="error-box">
        Bir şeyler ters gitti:
        <strong>${escapeHtml(err.message || String(err))}</strong>
      </div>
    `);

  }finally{
    statusLine.style.display = 'none';
    logoImg.classList.remove('spin-globe');
    btn.disabled = false;
  }
}

// ARAMA SONUÇLARI
function renderResults(parsed){

  if(parsed.answer){
    answerArea.insertAdjacentHTML('beforeend', `
      <div class="answer-card">
        <div class="answer-card-inner">
          <div class="answer-label">⚡ En faydalı cevap</div>
          <div class="answer-text">${escapeHtml(parsed.answer)}</div>
        </div>
      </div>
    `);
  }

  if(parsed.results && parsed.results.length){
    let html = `
      <div class="results-list">
        <div class="results-list-label">Eşleşen siteler</div>
    `;

    parsed.results.forEach(r => {
      html += `
        <div class="result-item">
          <a
            class="result-title"
            href="${escapeHtml(r.url)}"
            target="_blank"
            rel="noopener noreferrer"
          >${escapeHtml(r.title)}</a>

          <div class="result-url">
            ${escapeHtml(domainOf(r.url))}
          </div>

          <div class="result-snippet">
            ${escapeHtml(r.snippet || '')}
          </div>
        </div>
      `;
    });

    html += '</div>';
    listArea.innerHTML = html;
  }
}
</script>

<script src="/js/prayer.js"></script>
<script src="/js/calc.js"></script>
<script src="/js/live-match.js"></script>

</body>
